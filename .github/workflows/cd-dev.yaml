name: Deploy Development

on:
  push:
    branches: [ "dev" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [book-service, review-service, frontend-service]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:dev-latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:dev-${{ github.sha }}

  update-image-tags:
    name: Update Helm Image Tags
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -O /usr/bin/yq && sudo chmod +x /usr/bin/yq

      - name: Update Helm Override Files
        run: |
          for service in book-service review-service frontend-service; do
            APP_NAME=$(echo "$service" | sed 's/-service//')
            yq -i '.image.tag = "dev-${{ github.sha }}"' helm/apps/${APP_NAME}-dev.yaml
          done

      - name: Commit Tag Changes Back to Monorepo
        run: |
          git config user.name "GitOps Bot"
          git config user.email "gitops@bot.com"
          git add helm/apps/
          git diff-index --quiet HEAD || git commit -m "GitOps: update dev image tags to dev-${{ github.sha }}"
          git push origin dev
